<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>野球スコアキーパー</title>
<style>
:root {
  --bg:#0f0f0f;
  --panel:#1a1a1a;
  --panel-2:#242424;
  --text:#ffffff;
  --muted:#bdbdbd;
  --blue:#3b82f6;
  --red:#ef4444;
  --green:#22c55e;
  --yellow:#f59e0b;
  --danger:#ef4444;
  --radius:12px;
  --gap:10px;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
.wrap{max-width:980px;margin:10px auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between}
.team{flex:1;background:var(--panel);border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;user-select:none}
.team .label{font-weight:700;font-size:18px}
.team .score{font-size:40px;margin-top:6px}
.center-controls{display:flex;flex-direction:column;align-items:center;gap:8px}
.halfbox{background:var(--panel-2);padding:10px;border-radius:10px;text-align:center;min-width:92px;cursor:pointer}
.half-text{font-weight:800;font-size:18px;padding:2px 6px;border-radius:6px;color:white}
.inning-num{font-size:18px;margin-top:6px}
.inning-controls{display:flex;gap:6px;margin-top:6px}
.small{background:transparent;border:1px solid #333;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.scoreboard{display:flex;gap:8px;align-items:flex-start;overflow:auto;padding-bottom:6px}
.innings{display:flex;gap:6px;align-items:flex-start}
.inning{min-width:64px;background:var(--panel);padding:8px;border-radius:8px;text-align:center}
.inning .title{font-weight:700;margin-bottom:6px}
.inning .runs{font-size:20px}
.right-stats{min-width:150px;background:var(--panel);padding:10px;border-radius:10px}
.rhe-row{display:flex;justify-content:space-between;padding:6px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{background:var(--panel);border-radius:10px;padding:8px 10px;min-width:30px;text-align:center;cursor:pointer;user-select:none;border:1px solid #222}
.pcounts{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:0px}
.pcount{flex:1;background:var(--panel);padding:10px;border-radius:10px;text-align:center;max-width:120px}
.pcount .label{color:white;font-size:13px;font-weight:bold}
.pcount .num{font-size:32px;font-weight:700;margin-top:6px}
.swap-area{display:flex;flex-direction:column;gap:6px;align-items:center}
.counter-box .label{color:white;font-size:14px;font-weight:bold}
.counter-box2 .label{color:white;font-size:14px;font-weight:bold}
.counters{display:flex;gap:12px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.counter-box{background:var(--panel);padding:8px 10px;border-radius:8px;min-width:88px;text-align:center}
.counter-box2{background:var(--panel);padding:8px 10px;border-radius:8px;min-width:170px;text-align:center}
.lamp{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);margin:2px;display:inline-block}
.controls-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.counter-box .lamps{display:flex;gap:4px;justify-content:center;margin-top:6px} /* ランプ横並び */
.counter-box2 .lamps{display:flex;gap:4px;justify-content:center;margin-top:6px} /* ランプ横並び */
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* 追加: 投手名/チーム名入力欄のスタイル */
.p-name-input {
  width: 90%;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #333;
  background: #242424;
  color: var(--text);
  text-align: center;
  font-size: 14px;
  margin: 4px 0;
}

@media (max-width:600px){
  .team .score{font-size:34px}
  .btn{min-width:30px;padding:10px}
  .inning{min-width:56px}
}
/* カウント/アクションボタンの基本スタイルを統一 */
.btn, #btn-ball, #btn-strike-s, #btn-strike-k, #btn-out  {
  font-size:14px;
  color: #fff !important;
  background: #374151 !important;
  border: 1px solid #64748b !important;
}

/* Undo/Resetボタンの配色 (前回の変更を復元) */
#btn-undo { 
  background: rgb(61,9,87) !important;
  border-color: rgb(70, 20, 100) !important;
}
#btn-reset { 
  background: rgb(84,10,13) !important;
  border-color: rgb(100, 20, 25) !important;
}

/* Hit入力パネルのスタイル (前回の変更を復元) */
#hit-input-container {
    background: var(--panel-2);
    padding: 12px;
    border-radius: var(--radius);
    margin-top: 10px;
}
.hit-category-title {
    font-weight: 700;
    font-size: 16px;
    margin: 8px 0 6px 0;
    color: var(--muted);
}
.hit-category-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
}
.hit-option-btn {
    flex-grow: 1;
    background: #374151;
    color: #fff;
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    border: 1px solid #64748b;
    font-size: 13px;
    min-width: 80px;
    transition: background 0.1s, border-color 0.1s;
}
.hit-option-btn.selected {
    background: var(--blue) !important;
    border-color: #1d4ed8 !important;
    font-weight: bold;
}
.hit-option-btn.required-missing {
    background: #444 !important;
    border-color: #333 !important;
}
#record-hit-final-btn, #hit-cancel-btn {
    min-width: 150px;
    font-size: 16px;
    font-weight: bold;
    padding: 14px 16px;
    transition: opacity 0.2s, background 0.2s;
}
#record-hit-final-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
#record-hit-final-btn {
    background: var(--green) !important;
    border-color: #16a34a !important;
}
#hit-cancel-btn {
    background: #444 !important;
    border-color: #555 !important;
}

/* ランプの色 */
.lamp.ball-on, .lamp.base-on  { background: #22c55e; border-color: #22c55e; }
.lamp.strike-on{ background: #f59e0b; border-color: #f59e0b; }
.lamp.out-on   { background: #ef4444; border-color: #ef4444; }
.inning.current.omote {
  background: #2563eb !important; /* 表(青系→お好みで調整可) */
  color: #fff;
  box-shadow: 0 0 0 2px #2563eb70;
}
.inning.current.ura {
  background: #de2c3b !important;
  color: #fff;
  box-shadow: 0 0 0 2px #de2c3b80;
}
.inning.current {
  font-weight: bold;
  transform: scale(1.06);
  transition: background 0.15s, color: 0.15s, box-shadow 0.15s, transform 0.15s;
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="team" id="panel-sen" data-side="sen">
      <input type="text" id="teamname-sen" class="p-name-input" value="先攻" placeholder="チーム名" onblur="logTeamName('sen')" /> 
      <div class="score" id="score-sen">0</div>
    </div>

    <div class="center-controls">
      <div class="halfbox" id="halfbox" title="タップで表/裏切替">
        <div id="half-display" class="half-text" style="background:var(--blue);">表</div>
        <div class="inning-num" id="inning-display">1回</div>
      </div>
      <div class="inning-controls">
        <button class="small" id="inning-dec">◀</button>
        <button class="small" id="inning-inc">▶</button>
      </div>
    </div>

    <div class="team" id="panel-go" data-side="go">
      <input type="text" id="teamname-go" class="p-name-input" value="後攻" placeholder="チーム名" onblur="logTeamName('go')" />
      <div class="score" id="score-go">0</div>
    </div>
  </div>

  <div class="scoreboard" aria-label="スコアボード領域">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <strong>イニング得点<span class="note">（ ▶ボタンで追加 ）</span></strong>
      </div>
      <div class="innings" id="innings-area"></div>
    </div>

  <div class="right-stats">
    <div style="font-weight:800;text-align:center; color:#88f; margin-bottom:6px;">総合統計</div>
    <table style="width:100%; border-spacing:0; color:#fff; font-size:16px;">
      <tr>
        <th style="text-align:right; font-weight:normal;"></th>
        <th style="text-align:center; font-weight:normal;">先攻</th>
        <th style="text-align:center; font-weight:normal;">後攻</th>
      </tr>
      <tr>
        <td style="text-align:right; font-weight:bold;">R(得点)</td>
        <td style="text-align:center;" id="sen-R">0</td>
        <td style="text-align:center;" id="go-R">0</td>
      </tr>
      <tr>
        <td style="text-align:right; font-weight:bold;">H(安打)</td>
        <td style="text-align:center;" id="sen-H">0</td>
        <td style="text-align:center;" id="go-H">0</td>
      </tr>
      <tr>
        <td style="text-align:right; font-weight:bold;">E(失策)</td>
        <td style="text-align:center;" id="sen-E">0</td>
        <td style="text-align:center;" id="go-E">0</td>
      </tr>
    </table>
  </div>
  </div>
  
  <div id="hit-input-container" style="display: none;">
    <div class="hit-category-title">1. 結果種別 (必須)</div>
    <div class="hit-category-options" id="outcome-options">
      </div>
    
    <div class="hit-category-title">2. 打球タイプ (HR選択時は適用不要)</div>
    <div class="hit-category-options" id="type-options">
      </div>
    
    <div class="hit-category-title">3. 方向 (必須)</div>
    <div class="hit-category-options" id="direction-options">
      </div>
    
    <div class="actions" style="margin-top: 15px;">
        <button class="btn" id="record-hit-final-btn" disabled>決定・記録</button>
        <button class="btn" id="hit-cancel-btn">キャンセル</button>
    </div>
  </div>

  <div class="pcounts">
    <div class="pcount">
      <div class="label">先攻P Count</div>
      <input type="text" id="pname-sen" class="p-name-input" value="先攻 投手1" placeholder="投手名" onblur="logPitcherName('sen')" />
      <div class="num" id="pcount-sen">0</div>
    </div>
    <div class="swap-area">
      <button class="small" id="swap-sen">先攻P交代</button>
      <button class="small" id="swap-go">後攻P交代</button>
    </div>
    <div class="pcount">
      <div class="label">後攻P Count</div>
      <input type="text" id="pname-go" class="p-name-input" value="後攻 投手1" placeholder="投手名" onblur="logPitcherName('go')" />
      <div class="num" id="pcount-go">0</div>
    </div>
  </div>
  <div class="runners-area" style="background:var(--panel); padding:10px; border-radius:10px; margin-top:10px;">
    <div class="bases-container" style="display:flex; justify-content:center; gap:20px; margin-bottom:12px;">
    <div style="font-weight:700; text-align:center; color:var(--text); margin-bottom:8px;">ランナー(塁をタップ)</div>
      <div class="base-indicator" id="base-third" data-base="third" title="3塁ランナー (タップで切替)" style="cursor:pointer;">
        <div class="base-label" style="font-size:12px; color:var(--muted); text-align:center;">3塁</div>
        <span class="lamp base-lamp" id="lamp-third"></span>
      </div>
      <div class="base-indicator" id="base-second" data-base="second" title="2塁ランナー (タップで切替)" style="cursor:pointer;">
        <div class="base-label" style="font-size:12px; color:var(--muted); text-align:center;">2塁</div>
        <span class="lamp base-lamp" id="lamp-second"></span>
      </div>
      <div class="base-indicator" id="base-first" data-base="first" title="1塁ランナー (タップで切替)" style="cursor:pointer;">
        <div class="base-label" style="font-size:12px; color:var(--muted); text-align:center;">1塁</div>
        <span class="lamp base-lamp" id="lamp-first"></span>
      </div>
    </div>
    
    <div class="actions" style="margin-top: 5px; flex-wrap:nowrap;">
      <div class="btn" id="btn-record-runners" style="flex:1;">記録</div>
      <div class="btn" id="btn-stolen-base" style="flex:1;">盗塁</div>
      <div class="btn" id="btn-runner-out" style="flex:1;">ランナーOut</div>
    </div>
  </div>

  <div class="batter-area" style="background:var(--panel); padding:10px; border-radius:10px; text-align:center; margin-top:1px;">
      <input type="text" id="batter-name" placeholder="バッター名" onblur="logBatterName()" style="width: 80%; max-width: 300px; margin-top: 1px; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #242424; color: var(--text); text-align: center;" />
  </div>

  <div class="actions" id="main-actions-row">
    <div class="btn" id="btn-run">Run</div>
    <div class="btn" id="btn-hit-simple">Hit</div>
    <div class="btn" id="btn-hit-trigger">Hit詳細</div>
    <div class="btn" id="btn-deadball">DeadBall</div>
    <div class="btn" id="btn-error">Error</div>
  </div>
  <div class="counters">
    <div class="counter-box">
      <div class="lamps">
        <span class="lamp" id="ball1"></span>
        <span class="lamp" id="ball2"></span>
        <span class="lamp" id="ball3"></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;"> 
        <button class="btn" id="btn-ball" style="flex:1; padding:10px 14px; min-width:unset;">Ball</button>
      </div>
    </div>

    <div class="counter-box2">
      <div class="lamps">
        <span class="lamp" id="strike1"></span>
        <span class="lamp" id="strike2"></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;"> 
        <button class="btn" id="btn-strike-s" style="flex:1; padding:10px 14px; min-width:unset;">空振り</button>
        <button class="btn" id="btn-strike-k" style="flex:1; padding:10px 14px; min-width:unset;">見逃し</button>
      </div>
    </div>

    <div class="counter-box">
      <div class="lamps">
        <span class="lamp" id="out1"></span>
        <span class="lamp" id="out2"></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;"> 
        <button class="btn" id="btn-out" style="flex:1; padding:10px 14px; min-width:unset;">Out</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <div class="btn" id="btn-foul">Foul</div>
    <div class="btn" id="btn-undo">Undo</div> <div class="btn" id="btn-reset">Reset</div>
    <div class="btn" id="btn-log">Log Copy</div> 
  </div>

</div>

<div id="log-area" style="
  margin-top:16px; background:#1a1a1a; border-radius:8px; 
  padding:10px; min-height:80px; max-height:240px; overflow:auto; font-size:15px;">
</div>
<script>
/* -------------------------
   データ定義 (Hit詳細入力用)
   ------------------------- */
const HIT_OUTCOMES = {
  SI: '1.Single', DO: '2.Double', TR: '3.Triple', 
  HR: '4.Home Run', IS: 'Infield Single', BS: 'Bunt Single'
};
const BATTED_BALL_TYPES = {
  GB: 'Ground Ball', LD: 'Line Drive', FB: 'Fly Ball', 
  PU: 'Pop-up', BL: 'Bloop', HH: 'Hard-hit'
};
const DIRECTIONS = {
  LF: 'LF', LCF: 'LCF', CF: 'CF', 
  RCF: 'RCF', RF: 'RF', UM: 'P',
  SSH: 'SS-3B Hole', OTH: '1B-2B Hole', 
  LFL: 'LFL', RFL: 'RFL'
};


/* -------------------------
   状態管理
   ------------------------- */
// バッターの動的なデフォルト名を生成する関数
function getDefaultBatterName(inning, half, batterNum){
  const side = (half === '表') ? '表' : '裏';
  return `${inning}回${side} ${batterNum}番バッター`;
}

function createInitialState(){
  const initialSenP = '先攻 投手1';
  const initialGoP = '後攻 投手1';

  return {
    inning: 1,
    half: '表', // '表' or '裏'
    innings: {1: {sen:0, go:0}}, // 各イニングの得点のみ
    total: {sen:0, go:0},
    totals_RHE: {sen: {R:0,H:0,E:0}, go: {R:0,H:0,E:0}},
    counts: {ball:0, strike:0, out:0},
    pcount: {sen:0, go:0},
    pCountSen: 1, // 先攻P交代回数
    pCountGo: 1,  // 後攻P交代回数
    pNameSen: initialSenP, 
    pNameGo: initialGoP,  
    batterNum: 1, // 現在の打席番号 (1から連番)
    currentBatterName: getDefaultBatterName(1, '表', 1), // 現在のバッター名 (自動生成/手動入力)
    
    // ✅ 新規追加: チーム名
    teamNameSen: '先攻', 
    teamNameGo: '後攻', 
    
    // ✅ 新規追加: ランナー情報
    runners: {first: false, second: false, third: false}, // 1塁, 2塁, 3塁
    
    // ✅ 修正: deadBallsを追加
    pitcherStats: {
        [initialSenP]: { 
            totalPitches: 0, strikes: 0, balls: 0, hits: 0, 
            walks: 0, strikeouts: 0, runs: 0, deadBalls: 0
        },
        [initialGoP]: { 
            totalPitches: 0, strikes: 0, balls: 0, hits: 0, 
            walks: 0, strikeouts: 0, runs: 0, deadBalls: 0
        }
    },
    log: [], // ログエントリ配列
    tempHit: {} // 一時的なHit入力状態
  };
}
let state = createInitialState();
let history = []; // undo用スタック
const ACTION_LOCK_MS = 150; // 連打防止の短いロック

/* 小道具 (略) */
function deepCopy(obj){ return JSON.parse(JSON.stringify(obj)); }
function saveHistory(){
  const tempState = deepCopy(state);
  delete tempState.tempHit; 
  history.push(tempState); 
  if(history.length > 300) history.shift();
}
function setMessage(msg, timeout=2500){
  const el = document.getElementById('log-area'); 
  if(!el) return;
  el.style.border = '2px solid var(--blue)';
  el.style.fontWeight = 'bold';
  
  el.textContent = 'Notification: ' + msg; 
  
  if(timeout>0){
    clearTimeout(el._t);
    el._t = setTimeout(()=> {
        el.style.border = '1px solid transparent';
        el.style.fontWeight = 'normal';
        renderLog(); // ログ表示に戻す
    }, timeout);
  }
}

/* 操作ロック（ボタンの多重押し防止） */
let actionLocked = false;
function lockAction(){
  actionLocked = true;
  setTimeout(()=> actionLocked = false, ACTION_LOCK_MS);
}
function guardAction(){
  if(actionLocked){ return false; }
  lockAction();
  return true;
}

/* -------------------------
   統計更新ヘルパー関数
   ------------------------- */
function updatePitcherStat(statKey, value = 1){
  const currentPitcherName = (state.half === '表') ? state.pNameGo : state.pNameSen;
  const key = currentPitcherName.trim();
  if (!key) return; 

  if(!state.pitcherStats[key]){
    // ✅ 修正: 新規投手にも deadBalls を初期化
    state.pitcherStats[key] = { 
        totalPitches: 0, strikes: 0, balls: 0, hits: 0, 
        walks: 0, strikeouts: 0, runs: 0, deadBalls: 0 
    };
  }
  
  if (state.pitcherStats[key][statKey] !== undefined) {
      state.pitcherStats[key][statKey] += value;
  }
}

/* -------------------------
   レンダリング
   ------------------------- */
function ensureInningExists(n){
  if(!state.innings[n]) state.innings[n] = {sen:0, go:0};
}
function renderAll(){
  renderHeader();
  renderInnings();
  renderTotals();
  renderNames(); 
  renderCounts(); 
  updateBSOLamps();
  renderRunners(); // ✅ 新規追加
  renderLog();
}
function renderNames(){
    document.getElementById('pname-sen').value = state.pNameSen;
    document.getElementById('pname-go').value = state.pNameGo;
    document.getElementById('teamname-sen').value = state.teamNameSen; // ✅ チーム名
    document.getElementById('teamname-go').value = state.teamNameGo; // ✅ チーム名
    document.getElementById('batter-name').value = state.currentBatterName;
}

function renderLog(){
  const logArea = document.getElementById('log-area');
  if(!logArea || logArea.style.fontWeight === 'bold') return; 

  let html = '';
  state.log.slice(-30).reverse().forEach(e => {
    const d = new Date(e.time);
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    const sideP = (e.half === '表') ? e.pNameGo : e.pNameSen;
    
    html += `<div style="margin:2px 0;">
      <span style="color:#7cf; font-size:12px;">[${timeStr}]</span>
      <b style="color:#ffe970;">${e.msg}</b>
      <span style="color:#aaa;font-size:13px;">（${e.inning}回${e.half}, P:${sideP}, B:${e.batterName}）</span>
    </div>`;
  });
  logArea.innerHTML = html;
}
function renderHeader(){
  document.getElementById('score-sen').textContent = state.total.sen;
  document.getElementById('score-go').textContent = state.total.go;
  document.getElementById('inning-display').textContent = state.inning + '回';
  const halfEl = document.getElementById('half-display');

/* -------------------------
   ログ管理
   ------------------------- */
function addLog(msg){
  const entry = {
    time: new Date().toISOString(),
    inning: state.inning,
    half: state.half,
    msg,
    pNameSen: state.pNameSen,
    pNameGo: state.pNameGo,
    batterName: state.currentBatterName
  };
  state.log.push(entry);
}

function formatLogText(){
  const maxInning = Math.max(...Object.keys(state.innings).map(x=>parseInt(x)));
  
  let totalSection = '=== 総計 ===\n';
  totalSection += `先攻(${state.teamNameSen}) R:${state.totals_RHE.sen.R} H:${state.totals_RHE.sen.H} E:${state.totals_RHE.sen.E}\n`;
  totalSection += `後攻(${state.teamNameGo}) R:${state.totals_RHE.go.R} H:${state.totals_RHE.go.H} E:${state.totals_RHE.go.E}\n\n`;
  
  let inningSection = '=== イニング得点 ===\n';
  for(let i=1;i<=maxInning;i++){
    ensureInningExists(i);
    const s = state.innings[i].sen;
    const g = state.innings[i].go;
    inningSection += `${i}回 先攻:${s} 後攻:${g}\n`;
  }
  inningSection += '\n';

  let logSection = '=== 操作ログ（時系列） ===\n';
  state.log.forEach((e, idx)=>{
    const d = new Date(e.time);
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    const sideP = (e.half === '表') ? e.pNameGo : e.pNameSen;
    logSection += `${idx+1}. [${timeStr}] (${e.inning}回 ${e.half}, P:${sideP}, B:${e.batterName}) ${e.msg}\n`;
  });
  
  logSection += `\n--- 現在の投球数 ---\n`;
  logSection += `先攻P: ${state.pcount.sen}投  後攻P: ${state.pcount.go}投\n`;
  logSection += `現在の先攻P名: ${state.pNameSen}\n`;
  logSection += `現在の後攻P名: ${state.pNameGo}\n`;

  let statsSection = '\n=== 投手別詳細統計 ===\n';
  Object.keys(state.pitcherStats).forEach(pName => {
    const stats = state.pitcherStats[pName];
    if (!stats) return; 
    
    const totalP = stats.totalPitches;
    const strikeP = stats.strikes;
    const ballP = stats.balls;
    const hits = stats.hits;
    const walks = stats.walks;
    const strikeouts = stats.strikeouts;
    // ✅ 修正: deadBallsを取得
    const deadBalls = stats.deadBalls; 
    const runs = stats.runs;
    
    const strikeRate = totalP > 0 ? ((strikeP / totalP) * 100).toFixed(1) + '%' : 'N/A';
    
    statsSection += `--- ${pName.trim()} ---\n`;
    statsSection += ` 総投球数: ${totalP}投\n`;
    statsSection += ` (ストライク/ボール: ${strikeP}/${ballP})\n`;
    statsSection += ` ストライク成功率: ${strikeRate}\n`;
    statsSection += ` 被安打数: ${hits}\n`;
    // ✅ 修正: フォアボール数とデッドボール数を分離して表示
    statsSection += ` フォアボール数(BB): ${walks}\n`; 
    statsSection += ` デッドボール数(HBP): ${deadBalls}\n`; 
    statsSection += ` 三振数: ${strikeouts}\n`;
    statsSection += ` 失点: ${runs}\n`;
  });

  let out = totalSection + inningSection + logSection + statsSection;
  return out;
}

function renderHitOptions(){
    const outcomeContainer = document.getElementById('outcome-options');

    const directionContainer = document.getElementById('direction-options');
    
    [outcomeContainer, typeContainer, directionContainer].forEach(c => c.innerHTML = '');

        outcomeContainer.appendChild(btn);
    });
    Object.keys(BATTED_BALL_TYPES).forEach(key => {

        btn.onclick = () => selectBattedBallType(key);
        typeContainer.appendChild(btn);
    });

        const btn = createHitOptionButton(key, DIRECTIONS[key], 'direction');

        directionContainer.appendChild(btn);

function createHitOptionButton(key, text, category){
    const btn = document.createElement('div');
    btn.className = 'hit-option-btn';
    btn.textContent = text.replace(/（.+?）/g, '').replace(/^[0-9]\./, ''); 
    btn.title = text; 
    btn.dataset.key = key;
    btn.dataset.category = category;
    return btn;
}

function updateHitOptionSelections(){
    const { outcome, type, direction } = state.tempHit;

    document.querySelectorAll('.hit-option-btn').forEach(btn => {
        btn.classList.remove('selected', 'required-missing');
        const key = btn.dataset.key;
        const category = btn.dataset.category;

        if ((category === 'outcome' && key === outcome) ||
            (category === 'type' && key === type) ||
            (category === 'direction' && key === direction)) {
            btn.classList.add('selected');
        }
    });
    
    const isTypeOptional = (outcome === 'HR');
    document.getElementById('type-options').querySelectorAll('.hit-option-btn').forEach(btn => {
        btn.style.opacity = isTypeOptional ? 0.4 : 1;
        btn.style.cursor = isTypeOptional ? 'not-allowed' : 'pointer';
    });
    
    checkHitInputCompletion();
}

function checkHitInputCompletion(){
    const finalBtn = document.getElementById('record-hit-final-btn');
    const { outcome, direction } = state.tempHit;
    let isComplete = (outcome && direction);
    finalBtn.disabled = !isComplete;
}

   ルール処理（Ball/Strike/Out/Foul/Error/Run/DeadBall/Hit）
   ------------------------- */

function pressSimpleHit(){
  if(!guardAction()) return;
  hideHitOptions(); 
  saveHistory();
  
  const side = (state.half === '表') ? 'sen' : 'go';
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1; 
  updatePitcherStat('totalPitches');
  updatePitcherStat('hits');
  
  state.totals_RHE[side].H += 1; 
  state.counts.ball = 0; state.counts.strike = 0; 
  addLog('Hit (simple button) -> H +1, BS reset. ランナー状況は手動で更新してください。');
  incrementBatter('Hit(Simple)'); 
  renderAll();
}

function pressBall(){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1; 
  updatePitcherStat('totalPitches'); 
  updatePitcherStat('balls');        
  
  state.counts.ball += 1;
  addLog('Ball +1');
  if(state.counts.ball >= 4){
    state.counts.ball = 0;
    state.counts.strike = 0;
    updatePitcherStat('walks'); // 📝 Walk (四球)はwalksに加算
    addLog('Walk (Ball 4) => B,S reset. ランナー状況は手動で更新してください。');
    incrementBatter('Walk'); 
  }
  renderAll();
}

function pressStrike(type = ''){ 
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1; 
  updatePitcherStat('totalPitches'); 
  updatePitcherStat('strikes');       
  
  state.counts.strike += 1;
  
  const logMsg = (type === 'S') ? 'Strike +1 (S: Swinging)' : 
                   (type === 'K') ? 'Strike +1 (K: Looking)' : 
                                     'Strike +1';
  addLog(logMsg);

  if(state.counts.strike >= 3){
    state.counts.ball = 0;
    state.counts.strike = 0;
    state.counts.out += 1;
    updatePitcherStat('strikeouts'); 
    addLog(`Strikeout (${type}) -> Out +1 (BS reset)`);
    
    if(state.counts.out >= 3){
      state.counts.ball = 0; state.counts.strike = 0; state.counts.out = 0;
      toggleHalfOrAdvanceInning();
      addLog('3 Outs -> Inning change');
    } else {
      incrementBatter(`Strikeout (${type})`); 
    }
  }
  renderAll();
}

function recordHitFinal(){
  const { outcome, type, direction } = state.tempHit;
  if (document.getElementById('record-hit-final-btn').disabled) return;

  actionLocked = false;
  saveHistory();
  
  const side = (state.half === '表') ? 'sen' : 'go';
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
  updatePitcherStat('totalPitches');
  updatePitcherStat('hits');
  
  state.totals_RHE[side].H += 1;
  state.counts.ball = 0; state.counts.strike = 0;

  const outcomeText = HIT_OUTCOMES[outcome].replace(/\(.+?\)/g, '').replace(/^[0-9]\./, '');
  let details = [];
  let logMsg;
  
  if (type && outcome !== 'HR') {
      details.push(BATTED_BALL_TYPES[type]);
  }
  if (direction) {
      details.push(DIRECTIONS[direction]);
  }
  
  const detailsStr = details.length > 0 ? ` (${details.join(', ')})` : '';
  
  if (outcome === 'HR') {
      logMsg = `${outcomeText} -> ${DIRECTIONS[direction]} (HR, H +1, BS reset). ランナー状況は手動で更新してください。`;
  } else {
      logMsg = `${outcomeText}${detailsStr} (H +1, BS reset). ランナー状況は手動で更新してください。`;
  }

  addLog(logMsg);
  incrementBatter(`Hit(${outcomeText})`); 
  
  hideHitOptions();
  renderAll();
}

    if (state.runners.third) bases.push('3塁');

  saveHistory();
  
  state.runners[base] = !state.runners[base];
  addLog(`ベース状況手動切替: ${base} -> ${state.runners[base] ? 'ON' : 'OFF'}. 現在の状況: ${getRunnersText()}`);

  hideHitOptions();
  saveHistory();
  
  addLog(`ランナー状況記録: ${getRunnersText()}`);
  renderAll();

function pressStolenBase() {
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  
  // 盗塁ロジック (最も遠いベースの走者を1つ進める。3塁走者はRun)
  let logMsg = '盗塁失敗 - ランナーなし';
  
  if (state.runners.third) {
      state.runners.third = false;
      pressRun(); 
      logMsg = '盗塁成功(3塁走者ホームイン) -> Run +1, 3塁クリア';
  } else if (state.runners.second) {
      state.runners.second = false;
      state.runners.third = true;
      logMsg = '盗塁成功(2塁走者3塁へ)';
  } else if (state.runners.first) {
      state.runners.first = false;
      state.runners.second = true;
      logMsg = '盗塁成功(1塁走者2塁へ)';
  } else {
      setMessage(logMsg, 2000);
      history.pop(); 
      actionLocked = false;
      return; 
  }
  
  addLog(logMsg + `. 現在の状況: ${getRunnersText()}`);
  renderAll();
}

/* イニング遷移 (略) */
function toggleHalfOrAdvanceInning(){
  if(state.half === '表'){
    state.half = '裏';
  } else {
    state.half = '表';
    state.inning += 1;
    ensureInningExists(state.inning);
  }
  
  state.batterNum = 1; 
  updateBatterNameDynamic(); 
  
  // イニング/攻守交代でランナーをクリア
  state.runners = {first: false, second: false, third: false};
  
  renderAll();
}

/* -------------------------
   投手交代
   ------------------------- */
function swapPitcher(side){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  
  const totalBefore = state.pcount[side];
  
  if(side === 'sen') {
    state.pCountSen += 1;
    const newName = `先攻 投手${state.pCountSen}`; 
    addLog(`Pitcher change (先攻P) - 記録 ${totalBefore}球, ${state.pNameSen}から${newName}へ交代`);
    state.pNameSen = newName;
    state.pcount.sen = 0;
    // ✅ 修正: 新規投手にも deadBalls を初期化
    if(!state.pitcherStats[newName.trim()]) {
         state.pitcherStats[newName.trim()] = { totalPitches: 0, strikes: 0, balls: 0, hits: 0, walks: 0, strikeouts: 0, runs: 0, deadBalls: 0 };
    }
  }
  else {
    state.pCountGo += 1;
    const newName = `後攻 投手${state.pCountGo}`; 
    addLog(`Pitcher change (後攻P) - 記録 ${totalBefore}球, ${state.pNameGo}から${newName}へ交代`);
    state.pNameGo = newName;
    state.pcount.go = 0;
    // ✅ 修正: 新規投手にも deadBalls を初期化
    if(!state.pitcherStats[newName.trim()]) {
         state.pitcherStats[newName.trim()] = { totalPitches: 0, strikes: 0, balls: 0, hits: 0, walks: 0, strikeouts: 0, runs: 0, deadBalls: 0 };
    }
  }
  
  renderAll();
}

/* -------------------------
   UNDO / RESET / LOG (復元) (略)
   ------------------------- */
function undo(){
  if(!guardAction()) return;
  hideHitOptions();
  if(history.length === 0){
    setMessage('Undo 履歴がありません');
    return;
  }
  const prev = history.pop();
  state = deepCopy(prev);
  addLog('Undo operation');
  setMessage('操作を1つ戻しました');
  renderAll();
}
function resetAll(){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state = createInitialState();
  addLog('Full reset');
  setMessage('リセットしました');
  renderAll();
}
async function copyLogToClipboard(){
  if(!guardAction()) return;
  hideHitOptions();
  const text = formatLogText();
  try {
    await navigator.clipboard.writeText(text);
    setMessage('ログ内容がクリップボードにコピーされました！');
  } catch(e){
    alert('ログをクリップボードにコピーできませんでした。以下の内容を手動でコピーしてください:\n\n' + text);
  }
}
function updateBSOLamps(){
  for(let i=1;i<=3;i++){
    const el = document.getElementById('ball'+i);
    if(el) el.classList.toggle('ball-on', (i <= state.counts.ball));
  }
  for(let i=1;i<=2;i++){
    const el = document.getElementById('strike'+i);
    if(el) el.classList.toggle('strike-on', (i <= state.counts.strike));
  }
  for(let i=1;i<=2;i++){
    const el = document.getElementById('out'+i);
    if(el) el.classList.toggle('out-on', (i <= state.counts.out));
  }
}
/* -------------------------
   UI イベントバインド 
   ------------------------- */
document.getElementById('panel-sen').addEventListener('click', (e)=>{
  // チーム名入力欄のクリックは無視
  if (e.target.tagName.toLowerCase() === 'input') return;
  
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.innings[state.inning].sen += 1;
  state.total.sen += 1;
  state.totals_RHE.sen.R = state.total.sen;
  updatePitcherStat('runs'); 
  addLog(`Panel ${state.teamNameSen} clicked -> +1 Run`);
  renderAll();
});
document.getElementById('panel-go').addEventListener('click', (e)=>{
  // チーム名入力欄のクリックは無視
  if (e.target.tagName.toLowerCase() === 'input') return;

  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.innings[state.inning].go += 1;
  state.total.go += 1;
  state.totals_RHE.go.R = state.total.go;
  updatePitcherStat('runs'); 
  addLog(`Panel ${state.teamNameGo} clicked -> +1 Run`);
  renderAll();
});

document.getElementById('halfbox').addEventListener('click', ()=>{
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.half = (state.half === '表') ? '裏' : '表';
  addLog('Half toggle -> ' + state.half);
  
  state.batterNum = 1; 
  updateBatterNameDynamic(); 
  state.runners = {first: false, second: false, third: false}; // 攻守交代でランナークリア
  
  renderAll();
});
document.getElementById('inning-inc').addEventListener('click', ()=>{
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.inning += 1;
  ensureInningExists(state.inning);
  addLog('Inning ++ -> ' + state.inning);
  
  updateBatterNameDynamic();
  
  renderAll();
});
document.getElementById('inning-dec').addEventListener('click', ()=>{
  if(!guardAction()) return;
  hideHitOptions();
  if(state.inning <= 1) return;
  saveHistory();
  state.inning -= 1;
  addLog('Inning -- -> ' + state.inning);
  
  updateBatterNameDynamic(); 
  
  renderAll();
});

/* タッチ・クリックの視覚フィードバック（シンプル） */
document.querySelectorAll('.btn, .team, .small, .halfbox, .base-indicator').forEach(el=>{
  el.addEventListener('touchstart', ()=> el.style.opacity = 0.7, {passive:true});
  el.addEventListener('touchend', ()=> el.style.opacity = 1, {passive:true});
  el.addEventListener('mousedown', ()=> el.style.opacity = 0.7);
  el.addEventListener('mouseup', ()=> el.style.opacity = 1); 
  el.addEventListener('mouseleave', ()=> el.style.opacity = 1);
});
document.addEventListener('click', (e)=>{
    if(e.target.classList.contains('hit-option-btn')){
        e.target.style.opacity = 0.7;
        setTimeout(() => e.target.style.opacity = 1, 100);
    }
});

renderAll();
renderHitOptions();
