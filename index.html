<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>野球スコアキーパー</title>
<style>
:root {
  --bg:#0f0f0f;
  --panel:#1a1a1a;
  --panel-2:#242424;
  --text:#ffffff;
  --muted:#bdbdbd;
  --blue:#3b82f6;
  --red:#ef4444;
  --green:#22c55e;
  --yellow:#f59e0b;
  --danger:#ef4444;
  --radius:10px; /* 12pxから10pxに少し変更 */
  --gap:6px; /* 10pxから6pxに削減 */
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
/* --- 縦幅削減の主要な修正 --- */
.wrap{max-width:980px;margin:5px auto;padding:8px;display:flex;flex-direction:column;gap:8px} 
.top{display:flex;gap:6px;align-items:center;justify-content:space-between} 
.team{flex:1;background:var(--panel);border-radius:var(--radius);padding:8px;text-align:center;cursor:pointer;user-select:none} 
.team .label{font-weight:700;font-size:16px} 
.team .score{font-size:36px;margin-top:4px} 
.center-controls{display:flex;flex-direction:column;align-items:center;gap:4px} 
.halfbox{background:var(--panel-2);padding:6px;border-radius:8px;text-align:center;min-width:80px;cursor:pointer} 
.half-text{font-weight:800;font-size:16px;padding:2px 4px;border-radius:4px;color:white} 
.inning-num{font-size:16px;margin-top:4px} 
.inning-controls{display:flex;gap:4px;margin-top:4px} 
.small{background:transparent;border:1px solid #333;padding:4px 6px;border-radius:4px;cursor:pointer;color:var(--muted); font-size:12px;} 
.scoreboard{display:flex;gap:6px;align-items:flex-start;overflow:auto;padding-bottom:4px} 
.innings{display:flex;gap:4px;align-items:flex-start} 
.inning{min-width:56px;background:var(--panel);padding:6px;border-radius:6px;text-align:center} 
.inning .title{font-weight:700;margin-bottom:4px; font-size:14px;} 
.inning .runs{font-size:18px} 
.inning .runs div:nth-child(2){height:4px !important;} 
.right-stats{min-width:140px;background:var(--panel);padding:8px;border-radius:8px; font-size:14px;} 
.rhe-row{display:flex;justify-content:space-between;padding:4px 0} 
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px} 
.btn{background:var(--panel);border-radius:8px;padding:6px 8px;min-width:30px;text-align:center;cursor:pointer;user-select:none;border:1px solid #222; font-size:13px;} 
.pcounts{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:0px} 
.pcount{flex:1;background:var(--panel);padding:8px;border-radius:8px;text-align:center;max-width:120px} 
.pcount .label{color:white;font-size:12px;font-weight:bold} 
.pcount .num{font-size:28px;font-weight:700;margin-top:4px} 
.swap-area{display:flex;flex-direction:column;gap:4px;align-items:center} 
.counter-box .label{color:white;font-size:12px;font-weight:bold} 
.counter-box2 .label{color:white;font-size:12px;font-weight:bold} 
.counters{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap} 
.counter-box{background:var(--panel);padding:6px 8px;border-radius:6px;min-width:80px;text-align:center} 
.counter-box2{background:var(--panel);padding:6px 8px;border-radius:6px;min-width:160px;text-align:center} 
.lamp{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);margin:1px;display:inline-block} 
.controls-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px} 
.counter-box .lamps{display:flex;gap:3px;justify-content:center;margin-top:4px} 
.counter-box2 .lamps{display:flex;gap:3px;justify-content:center;margin-top:4px} 
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:4px} 

/* フォーム要素のパディング・マージン調整 */
.p-name-input {
  width: 90%;
  padding: 2px 4px;
  border-radius: 4px;
  border: 1px solid #333;
  background: #242424;
  color: var(--text);
  text-align: center;
  font-size: 13px;
  margin: 2px 0;
}
.runners-area {
    padding: 8px !important; 
    margin-top: 6px !important; 
}
.bases-container {
    margin-bottom: 8px !important;
}
.bases-container > div:first-child {
    margin-bottom: 4px !important;
}

/* 修正: batter-areaのID指定と基本スタイル */
#batter-area { /* IDで指定 */
    padding: 6px !important; 
    margin-top: 4px !important; 
    text-align:center;
    border-radius:10px;
    background: var(--panel); /* 規定色 */
    transition: background 0.3s ease; /* 色切り替えを滑らかに */
}
/* batter-areaの攻守別スタイル */
.batter-area-omote {
    background: #2563eb !important; /* 青 */
}
.batter-area-ura {
    background: #de2c3b !important; /* 赤 */
}

#batter-name {
    padding: 6px !important;
    font-size: 14px !important;
}


@media (max-width:600px){
  .team .score{font-size:30px} 
  .btn{min-width:30px;padding:8px} 
  .inning{min-width:48px} 
}
/* カウント/アクションボタンの基本スタイルを統一 */
.btn, #btn-ball, #btn-strike-s, #btn-strike-k, #btn-out  {
  font-size:13px; 
  color: #fff !important;
  background: #374151 !important;
  border: 1px solid #64748b !important;
}
/* カウントボタンのパディング調整 */
#btn-ball, #btn-strike-s, #btn-strike-k, #btn-out {
    padding:8px 10px !important; 
}

/* Undo/Resetボタンの配色 (前回の変更を維持) */
#btn-undo { 
  background: rgb(61,9,87) !important;
  border-color: rgb(70, 20, 100) !important;
}
#btn-reset { 
  background: rgb(84,10,13) !important;
  border-color: rgb(100, 20, 25) !important;
}

/* Hit入力パネルのスタイル調整 */
#hit-input-container {
    background: var(--panel-2);
    padding: 8px !important; 
    border-radius: var(--radius);
    margin-top: 6px !important; 
}
.hit-category-title {
    font-weight: 700;
    font-size: 14px; 
    margin: 6px 0 4px 0 !important; 
    color: var(--muted);
}
.hit-category-options {
    display: flex;
    flex-wrap: wrap;
    gap: 4px; 
    margin-bottom: 6px !important; 
}
.hit-option-btn {
    flex-grow: 1;
    background: #374151;
    color: #fff;
    border-radius: 6px; 
    padding: 6px 8px; 
    font-size: 12px; 
    min-width: 70px; 
}
#record-hit-final-btn, #hit-cancel-btn {
    min-width: 120px !important; 
    font-size: 14px !important; 
    padding: 10px 12px !important; 
}

/* ランプの色 (変更なし) */
.lamp.ball-on, .lamp.base-on  { background: #22c55e; border-color: #22c55e; }
.lamp.strike-on{ background: #f59e0b; border-color: #f59e0b; }
.lamp.out-on   { background: #ef4444; border-color: #ef4444; }
.inning.current.omote {
  background: #2563eb !important; 
  color: #fff;
  box-shadow: 0 0 0 2px #2563eb70;
}
.inning.current.ura {
  background: #de2c3b !important;
  color: #fff;
  box-shadow: 0 0 0 2px #de2c3b80;
}
.inning.current {
  font-weight: bold;
  transform: scale(1.06);
  transition: background 0.15s, color: 0.15s, box-shadow 0.15s, transform 0.15s;
}

/* ログエリアの調整 */
#log-area {
  margin-top: 10px !important;
  min-height: 60px !important;
  max-height: 180px !important;
  font-size: 13px !important;
  padding: 6px !important;
}
#log-area div {
    margin: 1px 0 !important;
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="team" id="panel-sen" data-side="sen" style="background:var(--blue);">
      <input type="text" id="teamname-sen" class="p-name-input" value="先攻" placeholder="チーム名" onblur="logTeamName('sen')" /> 
      <div class="score" id="score-sen">0</div>
    </div>

    <div class="center-controls">
      <div class="halfbox" id="halfbox" title="タップで表/裏切替">
        <div id="half-display" class="half-text" style="background:var(--blue);">表</div>
        <div class="inning-num" id="inning-display">1回</div>
      </div>
      <div class="inning-controls">
        <button class="small" id="inning-dec">◀</button>
        <button class="small" id="inning-inc">▶</button>
      </div>
    </div>

    <div class="team" id="panel-go" data-side="go" style="background:var(--red);">
      <input type="text" id="teamname-go" class="p-name-input" value="後攻" placeholder="チーム名" onblur="logTeamName('go')" />
      <div class="score" id="score-go">0</div>
    </div>
  </div>

  <div class="scoreboard" aria-label="スコアボード領域">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <strong>イニング得点<span class="note">（ ▶ボタンで追加 ）</span></strong>
      </div>
      <div class="innings" id="innings-area"></div>
    </div>

  <div class="right-stats">
    <div style="font-weight:800;text-align:center; color:#88f; margin-bottom:6px;">総合統計</div>
    <table style="width:100%; border-spacing:0; color:#fff; font-size:16px;">
      <tr>
        <th style="text-align:right; font-weight:normal;"></th>
        <th style="text-align:center; font-weight:normal;">先攻</th>
        <th style="text-align:center; font-weight:normal;">後攻</th>
      </tr>
      <tr>
        <td style="text-align:right; font-weight:bold;">R(得点)</td>
        <td style="text-align:center;" id="sen-R">0</td>
        <td style="text-align:center;" id="go-R">0</td>
      </tr>
      <tr>
        <td style="text-align:right; font-weight:bold;">H(安打)</td>
        <td style="text-align:center;" id="sen-H">0</td>
        <td style="text-align:center;" id="go-H">0</td>
      </tr>
      <tr>
        <td style="text-align:right; font-weight:bold;">E(失策)</td>
        <td style="text-align:center;" id="sen-E">0</td>
        <td style="text-align:center;" id="go-E">0</td>
      </tr>
    </table>
  </div>
  </div>
  
  <div id="hit-input-container" style="display: none;">
    <div class="hit-category-title">1. 結果種別 (必須)</div>
    <div class="hit-category-options" id="outcome-options">
      </div>
    
    <div class="hit-category-title">2. 打球タイプ (HR選択時は適用不要)</div>
    <div class="hit-category-options" id="type-options">
      </div>
    
    <div class="hit-category-title">3. 方向 (必須)</div>
    <div class="hit-category-options" id="direction-options">
      </div>
    
    <div class="actions" style="margin-top: 15px;">
        <button class="btn" id="record-hit-final-btn" disabled>決定・記録</button>
        <button class="btn" id="hit-cancel-btn">キャンセル</button>
    </div>
  </div>

  <div class="pcounts">
    <div class="pcount">
      <div class="label">先攻P Count</div>
      <input type="text" id="pname-sen" class="p-name-input" value="先攻 投手1" placeholder="投手名" onblur="logPitcherName('sen')" />
      <div class="num" id="pcount-sen">0</div>
    </div>
    <div class="swap-area">
      <button class="small" id="swap-sen">先攻P交代</button>
      <button class="small" id="swap-go">後攻P交代</button>
    </div>
    <div class="pcount">
      <div class="label">後攻P Count</div>
      <input type="text" id="pname-go" class="p-name-input" value="後攻 投手1" placeholder="投手名" onblur="logPitcherName('go')" />
      <div class="num" id="pcount-go">0</div>
    </div>
  </div>
  <div class="runners-area" style="background:var(--panel); padding:10px; border-radius:10px; margin-top:10px;">
    <div class="bases-container" style="display:flex; justify-content:center; gap:20px; margin-bottom:12px;">
    <div style="font-weight:700; text-align:center; color:var(--text); margin-bottom:8px;">ランナー(塁をタップ)</div>
      <div class="base-indicator" id="base-third" data-base="third" title="3塁ランナー (タップで切替)" style="cursor:pointer;">
        <div class="base-label" style="font-size:12px; color:var(--muted); text-align:center;">3塁</div>
        <span class="lamp base-lamp" id="lamp-third"></span>
      </div>
      <div class="base-indicator" id="base-second" data-base="second" title="2塁ランナー (タップで切替)" style="cursor:pointer;">
        <div class="base-label" style="font-size:12px; color:var(--muted); text-align:center;">2塁</div>
        <span class="lamp base-lamp" id="lamp-second"></span>
      </div>
      <div class="base-indicator" id="base-first" data-base="first" title="1塁ランナー (タップで切替)" style="cursor:pointer;">
        <div class="base-label" style="font-size:12px; color:var(--muted); text-align:center;">1塁</div>
        <span class="lamp base-lamp" id="lamp-first"></span>
      </div>
    </div>
    
    <div class="actions" style="margin-top: 5px; flex-wrap:nowrap;">
      <div class="btn" id="btn-record-runners" style="flex:1;">記録</div>
      <div class="btn" id="btn-stolen-base" style="flex:1;">盗塁</div>
      <div class="btn" id="btn-runner-out" style="flex:1;">ランナーOut</div>
    </div>
  </div>

  <div id="batter-area"> <input type="text" id="batter-name" placeholder="バッター名" onblur="logBatterName()" style="width: 80%; max-width: 300px; margin-top: 1px; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #242424; color: var(--text); text-align: center;" />
  </div>

  <div class="actions" id="main-actions-row">
    <div class="btn" id="btn-run">Run</div>
    <div class="btn" id="btn-hit-simple">Hit</div>
    <div class="btn" id="btn-hit-trigger">Hit詳細</div>
    <div class="btn" id="btn-deadball">DeadBall</div>
    <div class="btn" id="btn-error">Error</div>
  </div>
  <div class="counters">
    <div class="counter-box">
      <div class="lamps">
        <span class="lamp" id="ball1"></span>
        <span class="lamp" id="ball2"></span>
        <span class="lamp" id="ball3"></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;"> 
        <button class="btn" id="btn-ball" style="flex:1; padding:10px 14px; min-width:unset;">Ball</button>
      </div>
    </div>

    <div class="counter-box2">
      <div class="lamps">
        <span class="lamp" id="strike1"></span>
        <span class="lamp" id="strike2"></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;"> 
        <button class="btn" id="btn-strike-s" style="flex:1; padding:10px 14px; min-width:unset;">空振り</button>
        <button class="btn" id="btn-strike-k" style="flex:1; padding:10px 14px; min-width:unset;">見逃し</button>
      </div>
    </div>

    <div class="counter-box">
      <div class="lamps">
        <span class="lamp" id="out1"></span>
        <span class="lamp" id="out2"></span>
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;"> 
        <button class="btn" id="btn-out" style="flex:1; padding:10px 14px; min-width:unset;">Out</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <div class="btn" id="btn-foul">Foul</div>
    <div class="btn" id="btn-undo">Undo</div> <div class="btn" id="btn-reset">Reset</div>
    <div class="btn" id="btn-log">Log Copy</div> 
  </div>

</div>

<div id="log-area" style="
  margin-top:16px; background:#1a1a1a; border-radius:8px; 
  padding:10px; min-height:80px; max-height:240px; overflow:auto; font-size:15px;">
</div>
<script>
/* -------------------------
   データ定義 (Hit詳細入力用)
   ------------------------- */
const HIT_OUTCOMES = {
  SI: '1.Single', DO: '2.Double', TR: '3.Triple', 
  HR: '4.Home Run', IS: 'Infield Single', BS: 'Bunt Single'
};
const BATTED_BALL_TYPES = {
  GB: 'Ground Ball', LD: 'Line Drive', FB: 'Fly Ball', 
  PU: 'Pop-up', BL: 'Bloop', HH: 'Hard-hit'
};
const DIRECTIONS = {
  LF: 'LF', LCF: 'LCF', CF: 'CF', 
  RCF: 'RCF', RF: 'RF', UM: 'P',
  SSH: 'SS-3B Hole', OTH: '1B-2B Hole', 
  LFL: 'LFL', RFL: 'RFL'
};


/* -------------------------
   状態管理
   ------------------------- */
// バッターの動的なデフォルト名を生成する関数
function getDefaultBatterName(inning, half, batterNum){
  const side = (half === '表') ? '表' : '裏';
  return `${inning}回${side} ${batterNum}番バッター`;
}

function createInitialState(){
  const initialSenP = '先攻 投手1';
  const initialGoP = '後攻 投手1';

  return {
    inning: 1,
    half: '表', // '表' or '裏'
    innings: {1: {sen:0, go:0}}, // 各イニングの得点のみ
    total: {sen:0, go:0},
    totals_RHE: {sen: {R:0,H:0,E:0}, go: {R:0,H:0,E:0}},
    counts: {ball:0, strike:0, out:0},
    pcount: {sen:0, go:0},
    pCountSen: 1, // 先攻P交代回数
    pCountGo: 1,  // 後攻P交代回数
    pNameSen: initialSenP, 
    pNameGo: initialGoP,  
    batterNum: 1, // 現在の打席番号 (1から連番)
    currentBatterName: getDefaultBatterName(1, '表', 1), // 現在のバッター名 (自動生成/手動入力)
    
    // ✅ 新規追加: チーム名
    teamNameSen: '先攻', 
    teamNameGo: '後攻', 
    
    // ✅ 新規追加: ランナー情報
    runners: {first: false, second: false, third: false}, // 1塁, 2塁, 3塁
    
    // ✅ 修正: deadBallsを追加, ファウル数(fouls)を追加
    pitcherStats: {
        [initialSenP]: { 
            totalPitches: 0, strikes: 0, balls: 0, hits: 0, 
            walks: 0, strikeouts: 0, runs: 0, deadBalls: 0, fouls: 0 // <--- ADDED
        },
        [initialGoP]: { 
            totalPitches: 0, strikes: 0, balls: 0, hits: 0, 
            walks: 0, strikeouts: 0, runs: 0, deadBalls: 0, fouls: 0 // <--- ADDED
        }
    },
    log: [], // ログエントリ配列
    tempHit: {} // 一時的なHit入力状態
  };
}
let state = createInitialState();
let history = []; // undo用スタック
const ACTION_LOCK_MS = 150; // 連打防止の短いロック

/* 小道具 (略) */
function deepCopy(obj){ return JSON.parse(JSON.stringify(obj)); }
function saveHistory(){
  const tempState = deepCopy(state);
  delete tempState.tempHit; 
  history.push(tempState); 
  if(history.length > 300) history.shift();
}
function setMessage(msg, timeout=2500){
  const el = document.getElementById('log-area'); 
  if(!el) return;
  el.style.border = '2px solid var(--blue)';
  el.style.fontWeight = 'bold';
  
  el.textContent = 'Notification: ' + msg; 
  
  if(timeout>0){
    clearTimeout(el._t);
    el._t = setTimeout(()=> {
        el.style.border = '1px solid transparent';
        el.style.fontWeight = 'normal';
        renderLog(); // ログ表示に戻す
    }, timeout);
  }
}

/* 操作ロック（ボタンの多重押し防止） */
let actionLocked = false;
function lockAction(){
  actionLocked = true;
  setTimeout(()=> actionLocked = false, ACTION_LOCK_MS);
}
function guardAction(){
  if(actionLocked){ return false; }
  lockAction();
  return true;
}

/* -------------------------
   統計更新ヘルパー関数
   ------------------------- */
function updatePitcherStat(statKey, value = 1){
  const currentPitcherName = (state.half === '表') ? state.pNameGo : state.pNameSen;
  const key = currentPitcherName.trim();
  if (!key) return; 

  if(!state.pitcherStats[key]){
    // ✅ 修正: 新規投手にも deadBalls と fouls を初期化
    state.pitcherStats[key] = { 
        totalPitches: 0, strikes: 0, balls: 0, hits: 0, 
        walks: 0, strikeouts: 0, runs: 0, deadBalls: 0, fouls: 0 // <--- MODIFIED
    };
  }
  
  if (state.pitcherStats[key][statKey] !== undefined) {
      state.pitcherStats[key][statKey] += value;
  }
}

/* -------------------------
   レンダリング
   ------------------------- */
function ensureInningExists(n){
  if(!state.innings[n]) state.innings[n] = {sen:0, go:0};
}
function renderAll(){
  renderHeader();
  renderInnings();
  renderTotals();
  renderNames(); 
  renderCounts(); 
  updateBSOLamps();
  renderRunners(); // ✅ 新規追加
  renderLog();
}
function renderNames(){
    document.getElementById('pname-sen').value = state.pNameSen;
    document.getElementById('pname-go').value = state.pNameGo;
    document.getElementById('teamname-sen').value = state.teamNameSen; // ✅ チーム名
    document.getElementById('teamname-go').value = state.teamNameGo; // ✅ チーム名
    document.getElementById('batter-name').value = state.currentBatterName;
}

function renderLog(){
  const logArea = document.getElementById('log-area');
  if(!logArea || logArea.style.fontWeight === 'bold') return; 

  let html = '';
  state.log.slice(-30).reverse().forEach(e => {
    const d = new Date(e.time);
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    const sideP = (e.half === '表') ? e.pNameGo : e.pNameSen;
    
    html += `<div style="margin:2px 0;">
      <span style="color:#7cf; font-size:12px;">[${timeStr}]</span>
      <b style="color:#ffe970;">${e.msg}</b>
      <span style="color:#aaa;font-size:13px;">（${e.inning}回${e.half}, P:${sideP}, B:${e.batterName}）</span>
    </div>`;
  });
  logArea.innerHTML = html;
}
function renderHeader(){
  document.getElementById('score-sen').textContent = state.total.sen;
  document.getElementById('score-go').textContent = state.total.go;
  document.getElementById('inning-display').textContent = state.inning + '回';
  const halfEl = document.getElementById('half-display');
  const batterAreaEl = document.getElementById('batter-area'); // ✅ batter-areaを取得

  halfEl.textContent = state.half;
  // --- 色切り替えロジックの修正/統合 ---
  if(state.half === '表'){
    halfEl.style.background = "var(--blue)";
    halfEl.style.color = "#fff";
    // ✅ batter-areaのスタイル切り替え
    batterAreaEl.classList.remove('batter-area-ura');
    batterAreaEl.classList.add('batter-area-omote');
  } else {
    halfEl.style.background = "var(--red)";
    halfEl.style.color = "#fff";
    // ✅ batter-areaのスタイル切り替え
    batterAreaEl.classList.remove('batter-area-omote');
    batterAreaEl.classList.add('batter-area-ura');
  }
}
function renderInnings(){
  const container = document.getElementById('innings-area');
  container.innerHTML = '';
  const maxInning = Math.max(...Object.keys(state.innings).map(x=>parseInt(x)), state.inning);
  for(let i=1; i<=maxInning; i++){
     ensureInningExists(i);
     const el = document.createElement('div');
     let currentClass = '';
     if(i === state.inning){
       if(state.half === '表') currentClass = ' current omote';
       else currentClass = ' current ura';
     }
     el.className = 'inning' + currentClass;
     el.dataset.inning = i;
     el.innerHTML = `<div class="title">${i}回</div>
                    <div class="runs">
                      <div style="font-size:18px;font-weight:700" id="inning-${i}-sen">${state.innings[i].sen}</div>
                      <div style="height:8px"></div>
                      <div style="font-size:12px;color:var(--muted)">￣</div>
                      <div style="font-size:18px;font-weight:700" id="inning-${i}-go">${state.innings[i].go}</div>
                    </div>`;
    el.addEventListener('click', ()=>{
      if(!guardAction()) return;
      saveHistory();
      const side = (state.half === '表') ? 'sen' : 'go';
      state.innings[i][side] += 1;
      state.total[side] += 1;
      state.totals_RHE[side].R = state.total[side];
      updatePitcherStat('runs'); 
      addLog(`Inning ${i} ${side} +1 (manual inning click)`);
      renderAll();
    });
    container.appendChild(el);
  }
}

/* ------------------------- ログ管理 ------------------------- */
function addLog(msg){
  const entry = {
    time: new Date().toISOString(),
    inning: state.inning,
    half: state.half,
    pNameSen: state.pNameSen, // ログ時点のP名
    pNameGo: state.pNameGo,   // ログ時点のP名
    batterName: state.currentBatterName,
    msg: msg
  };
  state.log.push(entry);
  renderLog();
}
function updateBSOLamps(){
  const bEl = [document.getElementById('ball1'), document.getElementById('ball2'), document.getElementById('ball3')];
  const sEl = [document.getElementById('strike1'), document.getElementById('strike2')];
  const oEl = [document.getElementById('out1'), document.getElementById('out2')];

  bEl.forEach((el, i) => el.classList.toggle('ball-on', i < state.counts.ball));
  sEl.forEach((el, i) => el.classList.toggle('strike-on', i < state.counts.strike));
  oEl.forEach((el, i) => el.classList.toggle('out-on', i < state.counts.out));
}

function copyLogToClipboard(){
  let totalSection = `--- スコア ---\n`;
  totalSection += `${state.teamNameSen}: ${state.total.sen}R ${state.totals_RHE.sen.H}H ${state.totals_RHE.sen.E}E\n`;
  totalSection += `${state.teamNameGo}: ${state.total.go}R ${state.totals_RHE.go.H}H ${state.totals_RHE.go.E}E\n`;

  let inningSection = `\n--- イニング別得点 ---\n`;
  inningSection += `回 | ${Object.keys(state.innings).join(' | ')}\n`;
  inningSection += `先 | ${Object.keys(state.innings).map(i=>state.innings[i].sen).join(' | ')}\n`;
  inningSection += `後 | ${Object.keys(state.innings).map(i=>state.innings[i].go).join(' | ')}\n`;

  let logSection = '\n--- 試合ログ (新しい順) ---\n';
  state.log.slice().reverse().forEach(e => {
    const d = new Date(e.time);
    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    logSection += `[${timeStr}] ${e.inning}回${e.half} (P:${(e.half === '表') ? e.pNameGo : e.pNameSen}, B:${e.batterName}): ${e.msg}\n`;
  });

  // 投手統計
  let statsSection = '\n\n--- 投手統計 ---\n';
  Object.keys(state.pitcherStats).forEach(pName => {
    const stats = state.pitcherStats[pName];
    const totalP = stats.totalPitches;
    const strikeP = stats.strikes;
    const ballP = stats.balls;
    const hits = stats.hits;
    const walks = stats.walks;
    const strikeouts = stats.strikeouts;
    // ✅ 修正: deadBallsを取得
    const deadBalls = stats.deadBalls;
    const fouls = stats.fouls; // <--- ADDED: foulsを取得
    const runs = stats.runs;
    const strikeRate = totalP > 0 ? ((strikeP / (strikeP + ballP + deadBalls)) * 100).toFixed(1) + '%' : 'N/A';
    statsSection += `--- ${pName.trim()} ---\n`;
    statsSection += ` 総投球数: ${totalP}投\n`;
    statsSection += ` ストライク/ボール: ${strikeP}/${ballP}\n`;
    statsSection += ` ざっくりストライク成功率 [ ストライク数 ÷ （ストライク数 ＋ ボール数 + デッドボール数） ]: ${strikeRate}\n`;
    statsSection += ` 被安打数: ${hits}\n`;
    // ✅ 修正: フォアボール数とデッドボール数を分離して表示
    statsSection += ` フォアボール数(BB): ${walks}\n`;
    statsSection += ` デッドボール数(HBP): ${deadBalls}\n`;
    statsSection += ` ファウル数(F): ${fouls}\n`; // <--- ADDED: ファウル数を独立表示
    statsSection += ` 三振数: ${strikeouts}\n`;
    statsSection += ` 失点: ${runs}\n`;
  });


  let out = totalSection + inningSection + logSection + statsSection;
  
  navigator.clipboard.writeText(out).then(() => {
    setMessage('ログと統計情報をクリップボードにコピーしました！', 2000);
  }, (err) => {
    console.error('クリップボードへのコピーに失敗しました', err);
    setMessage('コピー失敗: コンソールを確認してください。', 3000);
  });
  
  return out;
}

      addLog(`後攻チーム名更新: ${state.teamNameGo} -> ${newName}`);

    state.teamNameGo = newName;
  }
}

  const inputEl = document.getElementById(`pname-${side}`);
  const newName = inputEl.value.trim();
  if (!newName) return; 

  // ✅ 修正: 新規投手にも deadBalls と fouls を初期化

    state.pitcherStats[newName] = { totalPitches: 0, strikes: 0, balls: 0, hits: 0, walks: 0, strikeouts: 0, runs: 0, deadBalls: 0, fouls: 0 }; // <--- MODIFIED

  if (side === 'sen') {
    if (newName !== state.pNameSen) {
      addLog(`先攻P名手動更新: ${state.pNameSen} -> ${newName}`);
    }
    state.pNameSen = newName;
  } else {
    if (newName !== state.pNameGo) {
      addLog(`後攻P名手動更新: ${state.pNameGo} -> ${newName}`);
    }
    state.pNameGo = newName;
  }
}

/* ------------------------- UI操作関連 ------------------------- */
function renderHitOptions(){
    // ... (HIT_OUTCOMES, BATTED_BALL_TYPES, DIRECTIONS を使ってボタンを生成する処理)
    // 割愛 - 以前のコードと変更なし
    const outcomeContainer = document.getElementById('outcome-options');
    const typeContainer = document.getElementById('type-options');
    const directionContainer = document.getElementById('direction-options');
    
    // Clear existing buttons
    outcomeContainer.innerHTML = '';
    typeContainer.innerHTML = '';
    directionContainer.innerHTML = '';

    // Outcome Buttons
    Object.keys(HIT_OUTCOMES).forEach(key => {
        const btn = createHitOptionButton(key, HIT_OUTCOMES[key], 'outcome');
        btn.addEventListener('click', () => selectHitOutcome(key));
        outcomeContainer.appendChild(btn);
    });

    // Type Buttons
    Object.keys(BATTED_BALL_TYPES).forEach(key => {
        const btn = createHitOptionButton(key, BATTED_BALL_TYPES[key], 'type');
        btn.addEventListener('click', () => selectBattedBallType(key));
        typeContainer.appendChild(btn);
    });

    // Direction Buttons
    Object.keys(DIRECTIONS).forEach(key => {
        const btn = createHitOptionButton(key, DIRECTIONS[key], 'direction');
        btn.addEventListener('click', () => selectDirection(key));
        directionContainer.appendChild(btn);
    });

    updateHitOptionSelections();
}
function createHitOptionButton(key, text, category){
  const btn = document.createElement('div');
  btn.className = 'hit-option-btn';
  btn.textContent = text.replace(/（.+?）/g, '').replace(/^[0-9]\./, '');
  btn.title = text;
  btn.dataset.key = key;
  btn.dataset.category = category;
  return btn;
}
function updateHitOptionSelections(){
  const { outcome, type, direction } = state.tempHit;
  document.querySelectorAll('.hit-option-btn').forEach(btn => {
    btn.classList.remove('selected', 'required-missing');
    const key = btn.dataset.key;
    const category = btn.dataset.category;
    if ((category === 'outcome' && key === outcome) || (category === 'type' && key === type) || (category === 'direction' && key === direction)) {
      btn.classList.add('selected');
    }
  });
  const isTypeOptional = (outcome === 'HR');
  document.getElementById('type-options').querySelectorAll('.hit-option-btn').forEach(btn => {
    btn.style.opacity = isTypeOptional ? 0.4 : 1;
    btn.style.cursor = isTypeOptional ? 'not-allowed' : 'pointer';
  });
  checkHitInputCompletion();
}
function checkHitInputCompletion(){
  const finalBtn = document.getElementById('record-hit-final-btn');
  const { outcome, direction } = state.tempHit;
  let isComplete = (outcome && direction);
  finalBtn.disabled = !isComplete;
}
function showHitOptions(){
  if(!guardAction()) return;
  state.tempHit = {};
  renderHitOptions();
  updateHitOptionSelections();
  document.getElementById('hit-input-container').style.display = 'block';
  document.getElementById('btn-hit-trigger').style.display = 'none';
  document.getElementById('btn-error').style.display = 'none';
  document.getElementById('btn-run').style.display = 'none';
  document.getElementById('btn-hit-simple').style.display = 'none';
  document.getElementById('btn-deadball').style.display = 'none';
  // ランナー操作パネルも非表示
  document.querySelector('.runners-area').style.display = 'none';
}
function hideHitOptions(){
  document.getElementById('hit-input-container').style.display = 'none';
  document.getElementById('btn-hit-trigger').style.display = 'block';
  document.getElementById('btn-error').style.display = 'block';
  document.getElementById('btn-run').style.display = 'block';
  document.getElementById('btn-hit-simple').style.display = 'block';
  document.getElementById('btn-deadball').style.display = 'block';
  // ランナー操作パネルを再表示
  document.querySelector('.runners-area').style.display = 'block';
  state.tempHit = {};
}
/* ------------------------- 選択肢のロジック (略) ------------------------- */
function selectHitOutcome(key){
  state.tempHit.outcome = key;
  if(key === 'HR'){
    state.tempHit.type = undefined;
  }
  updateHitOptionSelections();
}
function selectBattedBallType(key){
  if(state.tempHit.outcome === 'HR') return;
  state.tempHit.type = key;
  updateHitOptionSelections();
}
function selectDirection(key){
  state.tempHit.direction = key;
  updateHitOptionSelections();
}

/* ------------------------- ルール処理（ボール、ストライク、アウトなど） ------------------------- */
function advanceRunnersForWalk(){
  let runScored = false;
  // 3塁ランナー
  if(state.runners.third && state.runners.second && state.runners.first){
      runScored = true; state.runners.third = true; state.runners.second = true; state.runners.first = true;
  } else if(state.runners.second && state.runners.first){
      state.runners.third = state.runners.second; state.runners.second = state.runners.first; state.runners.first = true;
  } else if(state.runners.first){
      state.runners.second = state.runners.first; state.runners.first = true;
  }
  
  if(runScored){
    const side = (state.half === '表') ? 'sen' : 'go';
    state.innings[state.inning][side] += 1;
    state.total[side] += 1;
    state.totals_RHE[side].R = state.total[side];
    updatePitcherStat('runs'); 
  }

  // 1塁: 打者が進塁
  state.runners.first = true;

  // 3. ログ記録 (詳細を追記)
  let logMsg = runScored ? `【自動】押し出しにより得点！ ` : `【自動】四球による走者進塁。`;
  addLog(logMsg + `現在の塁状況: ${getRunnersText()}`);
}

function pressBall(){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
  updatePitcherStat('totalPitches');
  updatePitcherStat('balls');
  state.counts.ball += 1;
  addLog('Ball +1');

  if(state.counts.ball >= 4){
    state.counts.ball = 0;
    state.counts.strike = 0;
    updatePitcherStat('walks'); // 📝 Walk (四球)はwalksに加算
    // ⬇️ 修正: 自動進塁処理を追加
    advanceRunnersForWalk();
    // 修正: ログメッセージを自動処理が完了したことを示すものに変更
    addLog('Walk (Ball 4) 完了 => B,S reset.');
    incrementBatter('Walk');
  }
  renderAll();
}

function pressStrike(type = ''){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
  updatePitcherStat('totalPitches');
  updatePitcherStat('strikes');
  state.counts.strike += 1;
  const logMsg = (type === 'S') ? 'Strike +1 (S: Swinging)' : (type === 'K') ? 'Strike +1 (K: Looking)' : 'Strike +1';
  addLog(logMsg);

  if(state.counts.strike >= 3){
    state.counts.ball = 0;
    state.counts.strike = 0;
    state.counts.out += 1;
    updatePitcherStat('strikeouts');
    addLog(`Strikeout (${type}) -> Out +1 (BS reset)`);

    if(state.counts.out >= 3){
      state.counts.ball = 0;
      state.counts.strike = 0;
      state.counts.out = 0;
      toggleHalfOrAdvanceInning();
      addLog('3 Outs -> Inning change');
    } else {
      incrementBatter(`Strikeout (${type})`);
    }
  }
  renderAll();
}

function recordHitFinal(){
  const { outcome, type, direction } = state.tempHit;
  if (document.getElementById('record-hit-final-btn').disabled) return;

  actionLocked = false;
  saveHistory();

  const side = (state.half === '表') ? 'sen' : 'go';
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
  updatePitcherStat('totalPitches');
  updatePitcherStat('hits');
  state.totals_RHE[side].H += 1;
  state.counts.ball = 0;
  state.counts.strike = 0;
  
  const outcomeText = HIT_OUTCOMES[outcome].replace(/^[0-9]\./, '');
  const typeText = type ? ` (${BATTED_BALL_TYPES[type]})` : '';
  const directionText = direction ? ` to ${DIRECTIONS[direction]}` : '';

  addLog(`Hit! ${outcomeText}${typeText}${directionText}. B,S reset. ランナー状況は手動で更新してください。`);
  incrementBatter('Hit');
  hideHitOptions();
  renderAll();
}


function pressRun(){

  saveHistory();
  const side = (state.half === '表') ? 'sen' : 'go';
  state.innings[state.inning][side] += 1;
  state.total[side] += 1;
  state.totals_RHE[side].R = state.total[side];
  updatePitcherStat('runs');

}

function pressOut(){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
  updatePitcherStat('totalPitches');
  state.counts.out += 1;
  addLog('Out +1');

  if(state.counts.out >= 3){
    state.counts.ball = 0;
    state.counts.strike = 0;
    state.counts.out = 0;
    toggleHalfOrAdvanceInning();
    addLog('3 Outs -> Inning change');
  } else {
    state.counts.ball = 0;
    state.counts.strike = 0;
    incrementBatter('Out');
  }
  renderAll();
}

function pressFoul(){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
  updatePitcherStat('totalPitches');
  updatePitcherStat('fouls'); // <--- ADDED: ファウル数をカウント
  
  if(state.counts.strike < 2){
    state.counts.strike += 1;
    updatePitcherStat('strikes');
    addLog('Foul -> Strike +1');
  } else {
    addLog('Foul -> no strike increment (2 strikes already)');
  }
  renderAll();
}

// ✅ 新規追加: ランナー関連機能
function getRunnersText() {
  let bases = [];
  if (state.runners.first) bases.push('1塁');
  if (state.runners.second) bases.push('2塁');
  if (state.runners.third) bases.push('3塁');
  return bases.length > 0 ? bases.join(', ') : 'ランナーなし';
}

function toggleRunner(base) {
  if(!guardAction()) return;
  saveHistory();
  state.runners[base] = !state.runners[base];
  // addLog(`ベース状況手動切替: ${base} -> ${state.runners[base] ? 'ON' : 'OFF'}. 現在の状況: ${getRunnersText()}`);
  renderRunners();
}

function pressRecordRunners() {
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  addLog(`ランナー状況記録: ${getRunnersText()}`);
  renderAll();
}

function pressStolenBase() {
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();

  // ランナーの数を数える
  const runnerCount = (state.runners.first ? 1 : 0) + (state.runners.second ? 1 : 0) + (state.runners.third ? 1 : 0);
  
  // ランナーがいなければ盗塁は成立しない
  if (runnerCount === 0) {
    addLog('盗塁失敗 - ランナーなし');
    setMessage('盗塁失敗 - ランナーがいません', 1500);
    renderAll();
    return;
  }
  
  // 3塁ランナーがいればホームへ進める (得点計算)
  let runScored = false;
  if (state.runners.third) {
    const side = (state.half === '表') ? 'sen' : 'go';
    state.innings[state.inning][side] += 1;
    state.total[side] += 1;
    state.totals_RHE[side].R = state.total[side];
    updatePitcherStat('runs');
    state.runners.third = false;
    runScored = true;
  }
  
  // 2塁ランナーを3塁へ
  if (state.runners.second) {
    state.runners.third = true;
    state.runners.second = false;
  }

  // 1塁ランナーを2塁へ
  if (state.runners.first) {
    state.runners.second = true;
    state.runners.first = false;
  }
  
  const logMsg = runScored ? `盗塁成功! (1得点) ` : `盗塁成功!`;
  addLog(logMsg + `現在の塁状況: ${getRunnersText()}`);
  
  renderAll();
}

function pressRunnerOut() {
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();

  // ランナーOutロジック (最も遠いベースの走者をOutにする)
  let logMsg = 'ランナーOut失敗 - ランナーなし';
  let runnerOut = false;
  
  if (state.runners.third) {
    state.runners.third = false;
    logMsg = '3塁ランナーがアウト';
    runnerOut = true;
  } else if (state.runners.second) {
    state.runners.second = false;
    logMsg = '2塁ランナーがアウト';
    runnerOut = true;
  } else if (state.runners.first) {
    state.runners.first = false;
    logMsg = '1塁ランナーがアウト';
    runnerOut = true;
  }

  if (runnerOut) {
    state.counts.out += 1;
    addLog('Out +1');
    if(state.counts.out >= 3){
      state.counts.ball = 0;
      state.counts.strike = 0;
      state.counts.out = 0;
      toggleHalfOrAdvanceInning();
      addLog('3 Outs -> Inning change');
    } else {
      state.counts.ball = 0;
      state.counts.strike = 0;
      // ランナーアウトの場合は打者カウントは進めない
      // incrementBatter('Runner Out'); 
    }
    addLog(logMsg + ` -> Out +1. 現在の状況: ${getRunnersText()}`);
  } else {
     addLog(logMsg);
     setMessage('ランナーOut失敗 - ランナーがいません', 1500);
  }

  renderAll();
}


/* イニング遷移 (略) */
function toggleHalfOrAdvanceInning(){
  if(state.half === '表'){
    state.half = '裏';
  } else {
    state.half = '表';
    state.inning += 1;
    ensureInningExists(state.inning);
  }
  state.batterNum = 1;
  updateBatterNameDynamic();
  // イニング/攻守交代でランナーをクリア
  state.runners = {first: false, second: false, third: false};
  renderAll();
}

/* ------------------------- 投手交代 ------------------------- */
function swapPitcher(side){
  if(!guardAction()) return;
  hideHitOptions();
  saveHistory();
  const totalBefore = state.pcount[side];

  if(side === 'sen') {
    state.pCountSen += 1;
    const newName = `先攻 投手${state.pCountSen}`;
    addLog(`Pitcher change (先攻P) - 記録 ${totalBefore}球, ${state.pNameSen}から${newName}へ交代`);
    state.pNameSen = newName;
    state.pcount.sen = 0;
    // ✅ 修正: 新規投手にも deadBalls と fouls を初期化
    if(!state.pitcherStats[newName.trim()]) { 
      state.pitcherStats[newName.trim()] = { totalPitches: 0, strikes: 0, balls: 0, hits: 0, walks: 0, strikeouts: 0, runs: 0, deadBalls: 0, fouls: 0 }; // <--- MODIFIED
    }
  } else {
    state.pCountGo += 1;
    const newName = `後攻 投手${state.pCountGo}`;
    addLog(`Pitcher change (後攻P) - 記録 ${totalBefore}球, ${state.pNameGo}から${newName}へ交代`);
    state.pNameGo = newName;
    state.pcount.go = 0;
    // ✅ 修正: 新規投手にも deadBalls と fouls を初期化
    if(!state.pitcherStats[newName.trim()]) { 
      state.pitcherStats[newName.trim()] = { totalPitches: 0, strikes: 0, balls: 0, hits: 0, walks: 0, strikeouts: 0, runs: 0, deadBalls: 0, fouls: 0 }; // <--- MODIFIED
    }
  }
  renderAll();
}

/* ------------------------- UNDO / RESET / LOG (復元) (略) ------------------------- */
function undo(){
  if(!guardAction()) return;
  hideHitOptions();
  if(history.length === 0){
    setMessage('Undo 履歴がありません');
    return;
  }
  
  const prevState = history.pop();
  state = prevState;
  setMessage('Undo: 1つ前の状態に戻しました。');
  renderAll();
}
function resetAll(){
  if(!confirm('本当にすべてのスコアとログをリセットしますか？')) return;
  if(!guardAction()) return;
  hideHitOptions();
  history = [];
  state = createInitialState();
  setMessage('スコアボードをリセットしました！');
  renderAll();
}


/* ------------------------- イベントリスナー ------------------------- */
document.addEventListener('DOMContentLoaded', ()=>{
  renderAll(); 
  
  // クリックイベントのバインド
  document.getElementById('btn-ball').addEventListener('click', pressBall);
  document.getElementById('btn-strike-s').addEventListener('click', ()=> pressStrike('S'));
  document.getElementById('btn-strike-k').addEventListener('click', ()=> pressStrike('K'));
  document.getElementById('btn-out').addEventListener('click', pressOut);
  
  document.getElementById('btn-run').addEventListener('click', pressRun);
  document.getElementById('btn-hit-simple').addEventListener('click', ()=> {
    if(!guardAction()) return;
    saveHistory();
    const side = (state.half === '表') ? 'sen' : 'go';
    state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1;
    updatePitcherStat('totalPitches');
    updatePitcherStat('hits');
    state.totals_RHE[side].H += 1;
    state.counts.ball = 0;
    state.counts.strike = 0;
    addLog('Hit (Simple) -> B,S reset. ランナー状況は手動で更新してください。');
    incrementBatter('Hit');
    renderAll();
  });
  document.getElementById('btn-deadball').addEventListener('click', pressDeadBall);
  document.getElementById('btn-error').addEventListener('click', ()=> {
    if(!guardAction()) return;
    saveHistory();
    const side = (state.half === '表') ? 'sen' : 'go';
    state.pcount[(state.half === '表') ? 'go' : 'sen'] += 1; // Eでも投球数にカウント
    updatePitcherStat('totalPitches');
    state.totals_RHE[side].E += 1;
    state.counts.ball = 0;
    state.counts.strike = 0;
    addLog('Error +1 -> B,S reset. ランナー状況は手動で更新してください。');
    incrementBatter('Error');
    renderAll();
  });
  
  document.getElementById('panel-sen').addEventListener('click', (e)=>{
    // チーム名入力欄のクリックは無視
    if (e.target.tagName.toLowerCase() === 'input') return;
    if(!guardAction()) return;
    hideHitOptions();
    saveHistory();
    state.innings[state.inning].sen += 1;
    state.total.sen += 1;
    state.totals_RHE.sen.R = state.total.sen;
    updatePitcherStat('runs');
    addLog(`Panel ${state.teamNameSen} clicked -> +1 Run`);
    renderAll();
  });
  document.getElementById('panel-go').addEventListener('click', (e)=>{
    // チーム名入力欄のクリックは無視
    if (e.target.tagName.toLowerCase() === 'input') return;
    if(!guardAction()) return;
    hideHitOptions();
    saveHistory();
    state.innings[state.inning].go += 1;
    state.total.go += 1;
    state.totals_RHE.go.R = state.total.go;
    updatePitcherStat('runs');
    addLog(`Panel ${state.teamNameGo} clicked -> +1 Run`);
    renderAll();
  });

  document.getElementById('halfbox').addEventListener('click', ()=>{
    if(!guardAction()) return;
    hideHitOptions();
    saveHistory();
    state.half = (state.half === '表') ? '裏' : '表';
    addLog('Half toggle -> ' + state.half);
    state.batterNum = 1;
    updateBatterNameDynamic();
    state.runners = {first: false, second: false, third: false}; // 攻守交代でランナークリア
    renderAll();
  });

  document.getElementById('inning-inc').addEventListener('click', ()=>{
    if(!guardAction()) return;
    hideHitOptions();
    saveHistory();
    state.inning += 1;
    ensureInningExists(state.inning);
    addLog('Inning ++ -> ' + state.inning);
    updateBatterNameDynamic();
    renderAll();
  });
  document.getElementById('inning-dec').addEventListener('click', ()=>{
    if(!guardAction()) return;
    hideHitOptions();
    if(state.inning <= 1) return;
    saveHistory();
    state.inning -= 1;
    addLog('Inning -- -> ' + state.inning);
    updateBatterNameDynamic();
    renderAll();
  });

  document.getElementById('btn-foul').addEventListener('click', pressFoul);
  
  document.getElementById('swap-sen').addEventListener('click', ()=> swapPitcher('sen'));
  document.getElementById('swap-go').addEventListener('click', ()=> swapPitcher('go'));
  
  document.getElementById('btn-reset').addEventListener('click', resetAll);
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-log').addEventListener('click', copyLogToClipboard); 
  
  // Hit入力パネルの制御 (復元)
  document.getElementById('btn-hit-trigger').addEventListener('click', showHitOptions);
  document.getElementById('hit-cancel-btn').addEventListener('click', hideHitOptions);
  document.getElementById('record-hit-final-btn').addEventListener('click', recordHitFinal);
  
  // ✅ 新規追加: ランナー操作イベント
  document.getElementById('base-first').addEventListener('click', () => toggleRunner('first'));
  document.getElementById('base-second').addEventListener('click', () => toggleRunner('second'));
  document.getElementById('base-third').addEventListener('click', () => toggleRunner('third'));
  document.getElementById('btn-record-runners').addEventListener('click', pressRecordRunners);
  document.getElementById('btn-stolen-base').addEventListener('click', pressStolenBase);
  document.getElementById('btn-runner-out').addEventListener('click', pressRunnerOut);
  
  // P名とB名の onchange は HTML 内で logPitcherName/logBatterName にバインド済み
  
  
  /* タッチ・クリックの視覚フィードバック（シンプル） */
  document.querySelectorAll('.btn, .team, .small, .halfbox, .base-indicator').forEach(el=>{
    el.addEventListener('touchstart', ()=> el.style.opacity = 0.7, {passive:true});
    el.addEventListener('touchend', ()=> el.style.opacity = 1, {passive:true});
    el.addEventListener('mousedown', ()=> el.style.opacity = 0.7);
    el.addEventListener('mouseup', ()=> el.style.opacity = 1); 
    el.addEventListener('mouseleave', ()=> el.style.opacity = 1);
  });
  document.addEventListener('click', (e)=>{
      // hit-option-btn のクリックフィードバック
      if(e.target.classList.contains('hit-option-btn')){
          e.target.style.opacity = 0.7;
          setTimeout(() => { e.target.style.opacity = 1; }, 100); 
      }
  });

});
</script>
</body>
</html>
